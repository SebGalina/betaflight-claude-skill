name: Attach skill zip to release

# Builds the runtime-only skill zip and attaches it to a release when you
# publish one (via `gh release create` or the GitHub UI). Curated release notes
# stay manual; only the asset build is automated.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_skill_zip.py vendors the compute core into the zip. Install it
      # from PyPI into ./core (source only, --no-deps) at the version pinned in
      # pyproject.toml, then point the builder at it via CORE_REPO_PATH — CI
      # always vendors exactly the declared version, nothing to keep in sync.
      - name: Vendor betaflight-chirp-core from PyPI
        run: |
          VER="$(grep -oP 'betaflight-chirp-core==\K[0-9.]+' pyproject.toml)"
          echo "Pinned betaflight-chirp-core: $VER"
          pip install --target core --no-deps "betaflight-chirp-core==$VER"

      - name: Build skill zip
        env:
          CORE_REPO_PATH: ${{ github.workspace }}/core
        run: |
          TAG="${{ github.event.release.tag_name }}"
          python -m scripts.build_skill_zip --version "${TAG#v}"

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
