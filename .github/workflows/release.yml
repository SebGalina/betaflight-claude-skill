name: Attach skill zip to release

# Builds the runtime-only skill zip and attaches it to a release when you
# publish one (via `gh release create` or the GitHub UI). Curated release notes
# stay manual; only the asset build is automated.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build_skill_zip.py vendors the compute core into the zip, so the core
      # repo must be present. Resolve the pinned tag straight from pyproject.toml
      # (the `betaflight-chirp-core @ git+...@<tag>` dependency) so CI always
      # vendors exactly the declared version — no drift to keep in sync here.
      - name: Resolve pinned core ref
        id: core
        run: |
          REF="$(grep -oP 'betaflight-chirp-core @ git\+[^@]+@\K[^"]+' pyproject.toml)"
          echo "Pinned betaflight-chirp-core ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out betaflight-chirp-core
        uses: actions/checkout@v4
        with:
          repository: SebGalina/betaflight-chirp-core
          ref: ${{ steps.core.outputs.ref }}
          path: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build skill zip
        env:
          CORE_REPO_PATH: ${{ github.workspace }}/core
        run: |
          TAG="${{ github.event.release.tag_name }}"
          python -m scripts.build_skill_zip --version "${TAG#v}"

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
